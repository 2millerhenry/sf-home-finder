[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-home-finder"
version = "0.5.22"
description = "A small local monitor for San Francisco room and housing listings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henry Miller" }]
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.urls]
Homepage = "https://github.com/2millerhenry/sf-home-finder"
Source = "https://github.com/2millerhenry/sf-home-finder"
Issues = "https://github.com/2millerhenry/sf-home-finder/issues"

[project.scripts]
sf-housing = "sf_housing.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sf_housing", "sf_housing.*"]
namespaces = true

[tool.setuptools.package-data]
# The street table is consulted offline during every portal scan, so it
# has to be inside the wheel, not just in the repository.
"sf_housing" = ["data/*.json"]
"sf_housing.templates" = ["*.html"]
# The source logos are served from here, so they have to travel in the wheel.
# Listed as an explicit sub-path because source-icons is a directory of assets
# rather than a package, and packages.find will never see it.
# The tab icon is served from here too, and a top-level *.png is not
# covered by the source-icons sub-path.
"sf_housing.static" = ["*.css", "*.js", "*.zip", "*.svg", "*.png", "source-icons/*.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
