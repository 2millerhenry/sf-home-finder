{#- The logo, drawn into the page rather than fetched as an image.
    currentColor does not cross a document boundary, so an <img> or an <object>
    renders the artwork in its own black and stays black on the dark theme --
    where the supplied dark green would have been unreadable anyway. Inline, it
    takes the colour of the link around it, and one drawing serves both themes.

    Two of them, because the lockup is seven to one and a narrow window has no
    room for it: the bridge alone stands in below 760px. Both are hidden from
    screen readers and the link carries the name, so the swap cannot leave the
    link unnamed. Traced from the supplied artwork -- these are its shapes, not
    an impression of them. -#}
{#- The wordmark is set 26.5% larger than the supplied lockup had it, grown
    from its baseline rather than its middle so the two pieces still sit on
    one line. The bridge is untouched, and the drawing is still 281 units
    tall, so at a fixed header height the bridge keeps its size and only the
    lockup gets wider. -#}
