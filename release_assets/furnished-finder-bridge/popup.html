<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Furnished Finder Bridge</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">SF Home Finder</p>
      <h1>Furnished Finder</h1>
      <p id="help">Open a room or whole-unit search you want to keep, then save it once.</p>
      <button id="sync" type="button">Save this search &amp; sync</button>
      <p id="status" aria-live="polite"></p>
      <p class="fine-print">After setup, Chrome checks up to three saved searches at 10 AM and 6 PM and sends supported private rooms, studios, one-bedrooms, two-bedrooms, and three-bedrooms to the correct local shortlist.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
